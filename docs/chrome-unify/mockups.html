<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attaché Android · 顶栏 × 侧栏统一方案对比（A–E）</title>
<style>
:root{
  --ui:"Roboto","Google Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,"PingFang SC",monospace;
  --e:cubic-bezier(.2,.8,.2,1);
  --dur:.36s;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:#E6E2D9;color:#24262a;overflow:hidden;transition:background .3s}
body.pg-dark{background:#111316;color:#D7DAE0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ───────── page toolbar ───────── */
.ptb{height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55);backdrop-filter:blur(10px)}
.pg-dark .ptb{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.07)}
.ptb h1{font-size:15px;font-weight:650;margin:0 10px 0 0;white-space:nowrap}
.ptb h1 small{font-weight:400;opacity:.55;margin-left:6px;font-size:12px}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:10px;padding:3px;gap:2px}
.pg-dark .seg{background:rgba(255,255,255,.06)}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;white-space:nowrap;opacity:.72}
.seg button:hover{opacity:1}
.seg button.on{background:#fff;opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pg-dark .seg button.on{background:#2c3139}
.seg button.before{font-style:normal}
.ptb .hint{margin-left:auto;font-size:12px;opacity:.5;white-space:nowrap}

/* ───────── stage ───────── */
.stage{position:absolute;top:60px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:20px 24px}
.devbox{flex:none;position:relative}
.bezel{position:absolute;left:0;top:0;transform-origin:0 0;padding:14px;border-radius:38px;background:#121214;box-shadow:0 0 0 1.5px #3a3a3e inset,0 30px 70px rgba(0,0,0,.28),0 6px 18px rgba(0,0,0,.18)}
.card{flex:none;width:372px;max-height:100%;overflow:auto;background:rgba(255,255,255,.72);border-radius:18px;padding:20px 22px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(60,40,10,.08);font-size:13px;line-height:1.62;scrollbar-width:none}
.pg-dark .bezel{box-shadow:0 0 0 1.5px #4a4c52 inset,0 30px 70px rgba(0,0,0,.6)}
.pg-dark .card{background:#1a1d22;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:rgba(59,110,168,.12);color:#3B6EA8;margin-bottom:8px}
.pg-dark .card .tag{background:rgba(97,175,239,.14);color:#61AFEF}
.card h2{font-size:19px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.card .en{font-size:12.5px;opacity:.55;margin-bottom:12px}
.card h3{font-size:12px;letter-spacing:.06em;margin:14px 0 4px;opacity:.55;font-weight:700}
.card ul{margin:0;padding-left:18px}
.card li{margin:2px 0}
.card p{margin:0}
.card code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
.pg-dark .card code{background:rgba(255,255,255,.08)}
.card .cost{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600}
.card .stars{color:#C98A1B;letter-spacing:1px}

/* ───────── screen & themes ───────── */
.screen{position:relative;width:var(--W);height:var(--H);overflow:hidden;border-radius:22px;font-family:var(--ui);color:var(--ink);background:var(--paper);
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
.screen.light{
  --paper:#F7F3EA;--ink:#1F2328;--muted:#6F6A61;--faint:#9C978C;--line:rgba(70,55,30,.12);--line2:rgba(70,55,30,.07);
  --accent:#3B6EA8;--tint:#DEE6F0;--tint2:rgba(59,110,168,.07);--green:#3C9A5F;--btn:rgba(70,55,30,.065);--btnh:rgba(70,55,30,.11);
  --a-side:#F1ECE1;--b-side:#EEE8DB;--chrome:#E9E2D3;--sel-paper:#FBF8F2;
  --glass:rgba(251,248,241,.66);--glass-b:rgba(255,255,255,.75);--glass-s:0 10px 32px rgba(70,50,20,.16),0 1px 3px rgba(70,50,20,.10);
  --e-rail:#EFE8DA;--e-draw:#F3EDE2;--e-ind:#DAE3F1;--e-ind-t:#173A64;--e-fab:#D3E1F5;--e-fab-t:#12355E;
  --o-side:#F3F2EE;--o-head:#EBE9E3;--o-line:#DEDBD3;--o-chip:#EDE7DA;--o-chipb:#D8D0C1;--o-sel:#4A6EA5;--o-host:#E9E6DF;--o-moon:#F6EDD3;
  --scrim:rgba(20,18,14,.40);
  --k:#FFFFFF;--kb:#DDD6C8;--ky:#FBF1CF;--kyb:#E7D38F;--kyt:#5c4a10;--kbl:#DEE8F6;--kblb:#AEC5E7;--kblt:#2D5D9B;--kg:#E5F3E3;--kgb:#AAD5A6;--kgt:#2E7D32;--kr:#FBE6E4;--krb:#ECB0AC;--krt:#C0392B;--kesc:#EFC56E;--kesct:#B0601A;
  --tblue:#2F64A8;--tgreen:#2E8B57;--tred:#C0392B;--tcyan:#2B8A99;--tyel:#8A6A12;--tpur:#7A4FB3;
  --tmux1:#3B6EA8;--tmux2:#D9D2C3;--tmux3:#C9D7EA;
}
.screen.dark{
  --paper:#21252B;--ink:#D7DAE0;--muted:#9AA1AD;--faint:#6C737F;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
  --accent:#61AFEF;--tint:#2A3A4E;--tint2:rgba(97,175,239,.08);--green:#98C379;--btn:rgba(255,255,255,.065);--btnh:rgba(255,255,255,.11);
  --a-side:#1D2025;--b-side:#1A1D21;--chrome:#17191D;--sel-paper:#2A2F37;
  --glass:rgba(40,44,52,.62);--glass-b:rgba(255,255,255,.08);--glass-s:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --e-rail:#1A1D22;--e-draw:#1C1F25;--e-ind:#2B3A4F;--e-ind-t:#CFE3FA;--e-fab:#2A4566;--e-fab-t:#D3E4FF;
  --o-side:#1E1F22;--o-head:#18191B;--o-line:#2B2D30;--o-chip:#1C212B;--o-chipb:#2B323C;--o-sel:#3B6EA8;--o-host:#2A2C30;--o-moon:#2a2a22;
  --scrim:rgba(0,0,0,.52);
  --k:#2A2F37;--kb:#363C46;--ky:#3A3423;--kyb:#5A4E2B;--kyt:#E5C07B;--kbl:#24324A;--kblb:#34496A;--kblt:#8CC0F2;--kg:#23362A;--kgb:#355A3E;--kgt:#98C379;--kr:#3E2629;--krb:#64383C;--krt:#E06C75;--kesc:#7a5a28;--kesct:#E5A55B;
  --tblue:#61AFEF;--tgreen:#98C379;--tred:#E06C75;--tcyan:#56B6C2;--tyel:#E5C07B;--tpur:#C678DD;
  --tmux1:#61AFEF;--tmux2:#2F343D;--tmux3:#2B3A4F;
}
.screen svg{display:block}
.ico{width:18px;height:18px}

/* status bar */
.status{position:absolute;left:0;right:0;top:0;height:40px;z-index:60;display:flex;align-items:center;padding:0 24px 0 22px;pointer-events:none;color:var(--ink);font-size:14.5px}
.clock{font-weight:500;letter-spacing:.01em;margin-right:8px}
.apps{display:flex;gap:4px}
.apps i{width:12px;height:12px;border-radius:3px;display:block}
.status .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.status .mid i{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.45}
.status .sp{flex:1}
.net{font-size:7px;line-height:8px;font-weight:700;text-align:center;margin-right:6px}
.bat{display:flex;align-items:center;gap:5px;margin-left:5px;font-weight:500}
.gesture{position:absolute;left:50%;bottom:5px;width:150px;height:4px;margin-left:-75px;border-radius:3px;background:var(--ink);opacity:.28;z-index:60;pointer-events:none}

/* layers */
.topbar{position:absolute;top:0;left:0;right:0;height:78px;z-index:20;background:var(--paper);transition:left var(--dur) var(--e),background .3s}
.term{position:absolute;left:0;top:78px;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;
  transition:left var(--dur) var(--e),padding var(--dur) var(--e),border-radius var(--dur) var(--e),background .3s}
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.port.open .scrim{opacity:1;pointer-events:auto}
.side{position:absolute;left:0;top:78px;bottom:0;width:244px;z-index:25;overflow:hidden;display:flex;flex-direction:column;
  transition:width var(--dur) var(--e),transform var(--dur) var(--e),opacity .28s,box-shadow .3s,background .3s}
.side-in{width:244px;flex:1;min-height:0;display:flex;flex-direction:column}
.port .side-in{width:288px}
.port .side{width:288px;z-index:45;transform:translateX(-102%)}
.port.open .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.18)}
.land:not(.open) .side{width:0}

.fl{position:absolute;top:40px;height:38px;display:flex;align-items:center;z-index:30;
  transition:left var(--dur) var(--e),opacity .25s,color .3s}
.fl-back{left:8px;width:34px;justify-content:center}
.fl-back .ico{width:20px;height:20px}
.fl-tog,.fl-menu{left:42px;width:34px;justify-content:center}
.fl-brand{left:80px;font-size:15px;font-weight:650;letter-spacing:.01em;opacity:0;pointer-events:none;white-space:nowrap}
.fl-title{left:80px;font-size:15px;white-space:nowrap;gap:6px;cursor:default}
.fl-title .ts{color:var(--accent);font-weight:600}
.fl-title .tc{font-style:normal;font-size:10px;color:var(--muted);margin:0 2px 0 -2px}
.fl-title .tw{color:var(--ink);opacity:.72}
.fl-actions{right:10px;gap:6px;left:auto}
.ibtn{width:34px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s}
.ibtn:hover{background:var(--btnh)}
.btn{height:28px;min-width:32px;padding:0 8px;border-radius:8px;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--btnh)}
.btn .ico{width:16px;height:16px}
.btn.plain{background:none;min-width:24px;padding:0 4px}
.btn.plain:hover{background:var(--btnh)}
.screen .moon-i{display:block}.screen .sun-i{display:none}
.screen.dark .moon-i{display:none}.screen.dark .sun-i{display:block}

/* sidebar content (new schemes) */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
.scroll::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px 18px;font-size:11px;font-weight:650;letter-spacing:.08em;color:var(--muted)}
.sec .btn{height:24px;font-size:11.5px;letter-spacing:0;font-weight:600;color:var(--accent);padding:0 9px}
.host{position:relative;margin:1px 8px;padding:7px 10px 8px 30px;border-radius:10px;cursor:pointer}
.host:hover{background:var(--btn)}
.host .dot{position:absolute;left:13px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.host.on .dot{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.host .hn{font-size:14.5px;font-weight:500}
.host.on .hn{font-weight:650}
.host .hs{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess{display:flex;align-items:center;height:32px;padding:0 16px 0 14px;margin-top:4px;font-size:12.5px;font-weight:650;letter-spacing:.04em;color:var(--ink);cursor:pointer}
.sess .car{width:14px;font-size:9px;color:var(--faint)}
.sess .cnt{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--faint);letter-spacing:0}
.win{position:relative;display:flex;align-items:center;height:33px;margin:1px 8px;padding:0 10px 0 12px;border-radius:9px;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.win:hover{background:var(--btn)}
.win .n{width:22px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.win .wn{overflow:hidden;text-overflow:ellipsis}
.win.on{background:var(--tint);color:var(--accent);font-weight:600}
.win.on .n{color:var(--accent);opacity:.75}
.foot{flex:none;padding:6px 8px 10px;border-top:1px solid var(--line2)}
.frow{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap}
.frow:hover{background:var(--btn)}
.frow .ico{width:16px;height:16px;color:var(--muted)}
.frow .m{color:var(--muted);font-size:11.5px}
.frow .chev{margin-left:auto;color:var(--faint);font-size:12px}
.frow .gd{width:7px;height:7px;border-radius:50%;background:var(--green)}
.frow .mono{font-family:var(--mono);font-size:12px}
.frow .gear{margin-left:auto}
.dhead{flex:none;height:38px;display:none;align-items:center;padding:0 6px 0 18px;font-size:15px;font-weight:650}
.dhead .sp{flex:1}
.port .dhead{display:flex}

/* ───────── terminal ───────── */
.tcontent{flex:1;min-height:0;overflow:hidden;padding:8px 16px 0 14px;font-family:var(--mono);font-size:14px;line-height:18.5px;color:var(--ink)}
.tl{white-space:pre-wrap;word-break:break-all;min-height:18.5px}
.tl.b{font-weight:700}
.tl.ind{padding-left:66px;text-indent:-18px}
.tl.ind2{padding-left:72px}
.cjk{letter-spacing:.2em}
.c-b{color:var(--tblue)}.c-g{color:var(--tgreen)}.c-r{color:var(--tred)}.c-c{color:var(--tcyan)}.c-y{color:var(--tyel)}.c-p{color:var(--tpur)}.c-m{color:var(--muted)}
.trule{border-top:1px solid var(--muted);opacity:.55;margin:9px -16px 9px -14px}
.cursor{display:inline-block;width:9px;height:17px;background:var(--ink);vertical-align:-3px}
.cli{flex:none;font-family:var(--mono);font-size:14px;line-height:20px;padding:0 0 0 2px;white-space:nowrap;overflow:hidden}
.tmuxbar{flex:none;display:flex;font-family:var(--mono);font-size:12.5px;line-height:18px;white-space:nowrap;overflow:hidden;background:var(--tmux2)}
.tmuxbar span{padding:0 7px}
.tmuxbar .s1{background:var(--tmux1);color:var(--paper);font-weight:700}
.tmuxbar .cur{color:var(--accent);font-weight:700}
.tmuxbar .sp{flex:1}
.tmuxbar .r1{background:var(--tmux3)}
.tmuxbar .r2{background:var(--tmux1);color:var(--paper)}
.keys{flex:none;padding:5px 6px 6px;display:flex;flex-direction:column;gap:5px;font-family:var(--mono)}
.krow{display:flex;gap:6px;overflow:hidden}
.k{flex:1 0 0;min-width:40px;height:33px;border-radius:7px;border:1px solid var(--kb);background:var(--k);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);white-space:nowrap}
.krow.r2 .k{font-size:12.5px}
.k.y{background:var(--ky);border-color:var(--kyb);color:var(--kyt)}
.k.bl{background:var(--kbl);border-color:var(--kblb);color:var(--kblt)}
.k.g{background:var(--kg);border-color:var(--kgb);color:var(--kgt)}
.k.r{background:var(--kr);border-color:var(--krb);color:var(--krt)}
.k.esc{border-color:var(--kesc);color:var(--kesct)}
.k.gap{margin-left:10px}

/* ═════════ 现状 Before ═════════ */
.sch-before .side{background:var(--o-side);box-shadow:inset -1px 0 var(--o-line)}
.sch-before.port.open .side{box-shadow:inset -1px 0 var(--o-line)}
.sch-before .scrim{top:78px}
.sch-before.land.open .term{left:244px}
.sch-before .fl-title{left:44px;cursor:pointer;font-size:15px}
.sch-before .fl-title .ts{color:#3D6EAF;font-weight:500}
.sch-before.dark .fl-title .ts{color:#61AFEF}
.sch-before .fl-title .tw{color:#5F86B9;opacity:1}
.sch-before.dark .fl-title .tw{color:#8BB3DA}
.sch-before .fl-title .ob{width:14px;height:14px;color:#3D6EAF;margin-right:-1px}
.sch-before .fl-tog,.sch-before .fl-brand{display:none}
.obtn{height:28px;min-width:30px;padding:0 7px;border-radius:7px;border:1px solid var(--o-chipb);background:var(--o-chip);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink)}
.obtn.moon{background:var(--o-moon)}
.ohead{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 8px 0 11px;background:var(--o-head);border-bottom:1px solid var(--o-line)}
.ohead .t{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);flex:1}
.sch-before .sec{font-size:11px;letter-spacing:.05em;padding:16px 12px 7px 15px}
.sch-before .host.on{background:var(--o-host)}
.sch-before .host.on .dot{box-shadow:none}
.sch-before .win{margin:2px 10px;height:36px;border-radius:7px;font-size:14.5px;padding-left:20px}
.sch-before .win.on{background:var(--o-sel);color:#fff;font-weight:600}
.sch-before .win.on .n{color:#fff;opacity:.85}
.sch-before .sess{font-weight:500;font-size:13px;padding-left:18px}
.sch-before .foot{border-top:1px solid var(--o-line);padding:0}
.sch-before .frow{border-radius:0;height:42px;padding:0 12px}
.sch-before .frow+.frow{border-top:1px solid var(--o-line)}
.sch-before .divl{height:1px;background:var(--o-line);margin:8px 10px 0}

/* ═════════ A 同色同缝 ═════════ */
.sch-A .topbar{box-shadow:inset 0 -1px var(--line)}
.sch-A .vline{position:absolute;top:0;bottom:0;left:244px;width:1px;background:var(--line);z-index:31;transition:opacity .25s,left var(--dur) var(--e)}
.sch-A.port .vline,.sch-A.land:not(.open) .vline{opacity:0}
.sch-A .side{top:78px;background:var(--a-side)}
.sch-A .term{top:78px}
.sch-A.land.open .term{left:244px}
.sch-A.land.open .fl-brand{opacity:1}
.sch-A .fl-brand{left:84px;font-size:14px;color:var(--muted);font-weight:600}
.sch-A.land.open .fl-title{left:258px}
.sch-A .win.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.sch-A.port .side{top:40px}
.sch-A.port .dhead{box-shadow:inset 0 -1px var(--line)}
.sch-A .foot{border-top-color:var(--line)}

/* ═════════ B 全高侧栏 ═════════ */
.sch-B .side{top:0;padding-top:40px;background:var(--b-side);box-shadow:inset -1px 0 var(--line2)}
.sch-B .side-spacer{flex:none;height:38px}
.sch-B.port .side-spacer{display:none}
.sch-B .topbar{left:0}
.sch-B.land.open .topbar{left:244px}
.sch-B .term{top:78px}
.sch-B.land.open .term{left:244px}
.sch-B .fl-brand{left:46px}
.sch-B.land.open .fl-brand{opacity:1}
.sch-B.land.open .fl-tog{left:204px}
.sch-B.land.open .fl-title{left:258px}
.sch-B.port .fl-tog{z-index:50}
.sch-B.port.open .fl-tog{left:248px}
.sch-B .win{border-radius:8px}
.sch-B .foot{border-top:0}

/* ═════════ C L 形底盘 ═════════ */
.sch-C{background:var(--chrome)}
.sch-C .topbar{background:transparent}
.sch-C .side{top:78px;background:transparent}
.sch-C .term{top:78px;border-radius:0}
.sch-C.land.open .term{left:244px;border-top-left-radius:14px}
.sch-C.port .term{border-radius:14px 14px 0 0}
.sch-C .fl-brand{left:46px}
.sch-C.land.open .fl-brand{opacity:1}
.sch-C.land.open .fl-tog{left:204px}
.sch-C.land.open .fl-title{left:258px}
.sch-C.port .side{top:0;padding-top:40px;background:var(--chrome)}
.sch-C.port .fl-tog{z-index:50}
.sch-C.port.open .fl-tog{left:248px}

function screen(){
  const sc=S.scheme,o=S.orient;
  let h=status(o)+`<div class="term">${term()}</div><div class="topbar"></div>`;
  if(sc==='A') h+='<div class="vline"></div>';
  if(sc==='D'){
    h+=`<div class="cap capL glass"><button class="ibtn">${IC.back}</button><div class="tt js-title">${titleHTML(sc)}</div><button class="ibtn" data-act="toggle" title="侧栏">${IC.side}</button></div>`;
    h+=`<div class="cap capR glass">${actions(sc)}</div>`;
  }
  h+=`<div class="fl fl-back"><button class="ibtn">${IC.back}</button></div>`;
  if(sc==='E') h+=`<div class="fl fl-menu"><button class="ibtn" data-act="toggle" title="导航">${IC.menu}</button></div>`;
  h+=`<div class="fl fl-tog"><button class="ibtn" data-act="toggle" title="侧栏">${IC.side}</button></div><div class="fl fl-brand">Attaché</div>`;
  h+=`<div class="fl fl-title js-title" ${sc==='before'?'data-act="toggle"':''}>${titleHTML(sc)}</div><div class="fl fl-actions">${actions(sc)}</div>`;
  h+=`<div class="scrim" data-act="close"></div><div class="side">${side(sc,o)}</div><div class="gesture"></div>`;
  return h;
}
let scr;
function render(){
  const o=S.orient,W=o==='land'?1000:625,H=o==='land'?625:1000;
  bezel.innerHTML=`<div class="screen sch-${S.scheme} ${o} ${S.theme} ${S.open?'open':''}" style="--W:${W}px;--H:${H}px">${screen()}</div>`;
  scr=bezel.firstChild;
  document.body.classList.toggle('pg-dark',S.theme==='dark');
  segS.innerHTML=SCHEMES.map(s=>`<button data-s="${s}" class="${s===S.scheme?'on':''}">${SNAME[s]}</button>`).join('');
  segO.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.o===o));
  segT.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme));
  card.innerHTML=CARDS[S.scheme];
  fit();
}
function fit(){
  const o=S.orient,W=(o==='land'?1000:625)+28,H=(o==='land'?625:1000)+28;
  const st=document.querySelector('.stage'),cw=card.offsetWidth+28;
  const s=Math.min((st.clientWidth-48-cw)/W,(st.clientHeight-40)/H,1.35);
  bezel.style.transform=`scale(${s})`;devbox.style.width=W*s+'px';devbox.style.height=H*s+'px';
}
function setTheme(t){S.theme=t;scr.classList.remove('light','dark');scr.classList.add(t);document.body.classList.toggle('pg-dark',t==='dark');
  segT.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  scr.querySelectorAll('.obtn.moon').forEach(b=>b.textContent=t==='light'?'🌙':'☀️');}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-s]:not(.win)');if(b&&b.closest('#segS')){S.scheme=b.dataset.s;S.open=true;return render();}
  const ob=e.target.closest('#segO [data-o]');if(ob){S.orient=ob.dataset.o;S.open=true;return render();}
  const tb=e.target.closest('#segT [data-t]');if(tb){return setTheme(tb.dataset.t);}
  const w=e.target.closest('.win');
  if(w){S.sel={s:+w.dataset.s,i:+w.dataset.i};scr.querySelectorAll('.win.on').forEach(x=>x.classList.remove('on'));
    scr.querySelectorAll(`.win[data-s="${w.dataset.s}"][data-i="${w.dataset.i}"]`).forEach(x=>x.classList.add('on'));
    scr.querySelectorAll('.dest').forEach((d,i)=>d.classList.toggle('on',i===S.sel.s));
    scr.querySelectorAll('.js-title').forEach(t=>t.innerHTML=titleHTML(S.scheme));
    if(S.orient==='port') setTimeout(()=>{S.open=false;scr.classList.remove('open')},180);
    return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='toggle'){S.open=!S.open;scr.classList.toggle('open',S.open)}
  else if(act==='close'){S.open=false;scr.classList.remove('open')}
  else if(act==='open'){S.open=true;scr.classList.add('open')}
  else if(act==='theme'){setTheme(S.theme==='light'?'dark':'light')}
});
document.addEventListener('keydown',e=>{const i=SCHEMES.indexOf(S.scheme);
  if(e.key==='ArrowRight'){S.scheme=SCHEMES[(i+1)%6];S.open=true;render()}
  if(e.key==='ArrowLeft'){S.scheme=SCHEMES[(i+5)%6];S.open=true;render()}});
addEventListener('resize',fit);
